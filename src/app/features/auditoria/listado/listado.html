<mat-card>

  <mat-card-header>

    <mat-card-title>

      Hermanos

    </mat-card-title>

  </mat-card-header>

  <mat-card-content>

    <table mat-table [dataSource]="hermanos" class="mat-elevation-z2">

      <ng-container matColumnDef="numeroHermano">

        <th mat-header-cell *matHeaderCellDef>
          Nº
        </th>

        <td mat-cell *matCellDef="let hermano">
          {{ hermano.numeroHermano }}
        </td>

      </ng-container>

      <ng-container matColumnDef="nombre">

        <th mat-header-cell *matHeaderCellDef>
          Nombre
        </th>

        <td mat-cell *matCellDef="let hermano">
          {{ hermano.nombre }}
        </td>

      </ng-container>

      <ng-container matColumnDef="apellidos">

        <th mat-header-cell *matHeaderCellDef>
          Apellidos
        </th>

        <td mat-cell *matCellDef="let hermano">
          {{ hermano.apellidos }}
        </td>

      </ng-container>

      <ng-container matColumnDef="dni">

        <th mat-header-cell *matHeaderCellDef>
          DNI
        </th>

        <td mat-cell *matCellDef="let hermano">
          {{ hermano.dni }}
        </td>

      </ng-container>

      <ng-container matColumnDef="estado">

        <th mat-header-cell *matHeaderCellDef>
          Estado
        </th>

        <td mat-cell *matCellDef="let hermano">
          {{ hermano.estado }}
        </td>

      </ng-container>

      <ng-container matColumnDef="acciones">

        <th mat-header-cell *matHeaderCellDef>
          Acciones
        </th>

        <td mat-cell *matCellDef="let hermano">

          <button mat-icon-button color="primary">

            <mat-icon>edit</mat-icon>

          </button>

        </td>

      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    </table>

  </mat-card-content>

</mat-card>
