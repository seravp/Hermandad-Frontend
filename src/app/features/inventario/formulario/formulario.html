<h2 mat-dialog-title>{{ item ? 'Editar bien' : 'Nuevo bien' }}</h2>
<form [formGroup]="form" (ngSubmit)="guardar()"><mat-dialog-content class="formulario">
  <mat-form-field appearance="outline"><mat-label>Código</mat-label><input matInput formControlName="codigo"></mat-form-field><mat-form-field appearance="outline"><mat-label>Nombre</mat-label><input matInput formControlName="nombre"></mat-form-field>
  <mat-form-field appearance="outline"><mat-label>Categoría</mat-label><mat-select formControlName="categoria">@for (categoria of categorias; track categoria) {<mat-option [value]="categoria">{{ categoria }}</mat-option>}</mat-select></mat-form-field><mat-form-field appearance="outline"><mat-label>Ubicación</mat-label><input matInput formControlName="ubicacion"></mat-form-field>
  <mat-form-field appearance="outline"><mat-label>Estado</mat-label><mat-select formControlName="estado">@for (estado of estados; track estado) {<mat-option [value]="estado">{{estado}}</mat-option>}</mat-select></mat-form-field><mat-form-field appearance="outline"><mat-label>Fecha adquisición</mat-label><input matInput type="date" formControlName="fechaAdquisicion"></mat-form-field>
  <mat-form-field appearance="outline"><mat-label>Valor adquisición</mat-label><input matInput type="number" min="0" formControlName="valorAdquisicion"></mat-form-field><mat-form-field appearance="outline"><mat-label>Descripción</mat-label><input matInput formControlName="descripcion"></mat-form-field>
  <mat-form-field appearance="outline" class="completo"><mat-label>Observaciones</mat-label><textarea matInput rows="3" formControlName="observaciones"></textarea></mat-form-field>
  <div class="completo"><label for="imagen">Foto principal (JPG, PNG o WEBP, máximo 5 MB)</label><input id="imagen" type="file" accept="image/jpeg,image/png,image/webp" (change)="seleccionarImagen($event)"></div>
</mat-dialog-content><mat-dialog-actions align="end"><button mat-button type="button" mat-dialog-close>Cancelar</button><button mat-raised-button color="primary" type="submit">Guardar</button></mat-dialog-actions></form>
