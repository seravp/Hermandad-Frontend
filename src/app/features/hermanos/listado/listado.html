<mat-card class="hermanos-card">

  <mat-card-header>

    <div class="header-info">

      <mat-card-title>
        Hermanos
      </mat-card-title>

      <mat-card-subtitle>
        Gestión del censo de la Hermandad
      </mat-card-subtitle>

    </div>

    <button
      mat-raised-button
      color="primary"
      (click)="nuevoHermano()">

      <mat-icon>add</mat-icon>
      Nuevo hermano

    </button>

  </mat-card-header>

  <mat-card-content>

    <div class="toolbar">

      <mat-form-field
        appearance="outline"
        class="buscar">

        <mat-icon matPrefix>search</mat-icon>

        <input
          matInput
          [formControl]="busquedaControl"
          placeholder="Buscar por nombre, apellidos o DNI">

      </mat-form-field>

      <mat-form-field
        appearance="outline"
        class="estado">

        <mat-label>Estado</mat-label>

        <mat-select
          [(ngModel)]="estadoSeleccionado"
          (selectionChange)="buscar()">

          <mat-option value="">
            Todos
          </mat-option>

          <mat-option value="ACTIVO">
            Activo
          </mat-option>

          <mat-option value="BAJA">
            Baja
          </mat-option>

        </mat-select>

      </mat-form-field>

    </div>

    <table
      mat-table
      [dataSource]="dataSource"
      matSort
      (matSortChange)="ordenar($event)"
      class="tabla-hermanos mat-elevation-z1">

      <!-- Nº -->

      <ng-container matColumnDef="numeroHermano">

        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header="numeroHermano">

          Nº

        </th>

        <td mat-cell *matCellDef="let hermano">

          {{ hermano.numeroHermano }}

        </td>

      </ng-container>

      <!-- Nombre -->

      <ng-container matColumnDef="nombre">

        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header="nombre">

          Nombre

        </th>

        <td mat-cell *matCellDef="let hermano">

          {{ hermano.nombre }}

        </td>

      </ng-container>

      <!-- Apellidos -->

      <ng-container matColumnDef="apellidos">

        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header="apellidos">

          Apellidos

        </th>

        <td mat-cell *matCellDef="let hermano">

          {{ hermano.apellidos }}

        </td>

      </ng-container>

      <!-- DNI -->

      <ng-container matColumnDef="dni">

        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header="dni">

          DNI

        </th>

        <td mat-cell *matCellDef="let hermano">

          {{ hermano.dni }}

        </td>

      </ng-container>

      <!-- Estado -->

      <ng-container matColumnDef="estado">

        <th
          mat-header-cell
          *matHeaderCellDef
          class="mat-column-estado">

          Estado

        </th>

        <td
          mat-cell
          *matCellDef="let hermano"
          class="mat-column-estado">

          <mat-chip
            [ngClass]="obtenerClaseEstado(hermano.estado)">

            {{ obtenerTextoEstado(hermano.estado) }}

          </mat-chip>

        </td>

      </ng-container>

      <!-- Acciones -->

      <ng-container matColumnDef="acciones">

        <th
          mat-header-cell
          *matHeaderCellDef
          class="mat-column-acciones">

          Acciones

        </th>

        <td
          mat-cell
          *matCellDef="let hermano"
          class="mat-column-acciones">

          <div class="acciones">

            <button
              mat-icon-button
              class="btn-editar"
              matTooltip="Editar"
              (click)="editar(hermano)">

              <mat-icon>
                edit
              </mat-icon>

            </button>

            <button
              mat-icon-button
              class="btn-eliminar"
              matTooltip="Eliminar"
              (click)="eliminar(hermano)">

              <mat-icon>
                delete
              </mat-icon>

            </button>

          </div>

        </td>

      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns">
      </tr>

      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns">
      </tr>

    </table>

    <mat-paginator
      [length]="totalElements"
      [pageSize]="size"
      [pageSizeOptions]="[5,10,20,50]"
      (page)="cambiarPagina($event)">

    </mat-paginator>

  </mat-card-content>

</mat-card>
